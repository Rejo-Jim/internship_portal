{% extends "base.html" %}
{% block title %}Record Offer{% endblock %}
{% block content %}
<h4 class="section-title mb-3">Record Offer — {{ application.company_name }}</h4>

<form method="POST" class="needs-validation" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card">
    <div class="card-body row g-3">
      <div class="col-md-6">
        <label class="form-label">Company Name</label>
        <input type="text" class="form-control" value="{{ application.company_name }}" disabled>
      </div>
      <div class="col-md-6">
        <label class="form-label">Role</label>
        <input type="text" class="form-control" value="{{ application.role }}" disabled>
      </div>
      <div class="col-md-6">
        <label class="form-label">Offer Date</label>
        <input type="date" name="offer_date" class="form-control" value="{{ form.get('offer_date','') }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Joining Date</label>
        <input type="date" name="joining_date" class="form-control" value="{{ form.get('joining_date','') }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Internship Duration</label>
        <input type="text" name="duration" class="form-control" value="{{ form.get('duration','') }}" placeholder="e.g. 6 months">
      </div>
      <div class="col-md-4">
        <label class="form-label">Stipend</label>
        <input type="text" name="stipend" class="form-control" value="{{ form.get('stipend','') }}" placeholder="e.g. 15000">
      </div>
      <div class="col-md-4">
        <label class="form-label">Work Mode</label>
        <select name="work_mode" class="form-select">
          <option value="">Select</option>
          {% for wm in ["On-site","Hybrid","Remote"] %}
          <option value="{{ wm }}" {% if form.get('work_mode') == wm %}selected{% endif %}>{{ wm }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-control" value="{{ form.get('location', application.location or '') }}">
      </div>
    </div>
  </div>
  <button type="submit" class="btn btn-primary px-4 mt-3">Save Offer</button>
  <a href="{{ url_for('applications.detail', app_id=application.id) }}" class="btn btn-outline-secondary mt-3">Cancel</a>
</form>
{% endblock %}
