{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block guest_content %}

  <i class="bi bi-shield-lock display-1 text-danger"></i>
  <h2 class="mt-3">403 - Access Denied</h2>
  <p class="text-muted">You don't have permission to view this page.</p>

</div>
{% endblock %}
