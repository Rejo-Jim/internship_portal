{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block guest_content %}
<div class="auth-wrapper py-5">
  <div class="auth-card p-4 p-md-5" style="max-width: 640px;">
    <div class="text-center mb-4">
      <div class="login-brand"><i class="bi bi-mortarboard-fill"></i> Create Student Account</div>
      <div class="text-muted-small">Join the Internship &amp; Placement Portal</div>
    </div>
    <form method="POST" class="needs-validation" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <input type="text" name="full_name" class="form-control" value="{{ form.get('full_name','') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">College Email</label>
          <input type="email" name="email" class="form-control" value="{{ form.get('email','') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" name="password" id="regPassword" class="form-control" required minlength="6">
            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="regPassword"><i class="bi bi-eye"></i></button>
          </div>
          <div class="form-text">At least 6 characters.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" required minlength="6">
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone Number</label>
          <input type="text" name="phone" class="form-control" value="{{ form.get('phone','') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Branch / Department</label>
          <input type="text" name="branch" class="form-control" value="{{ form.get('branch','') }}" required placeholder="e.g. Computer Engineering">
        </div>
        <div class="col-md-4">
          <label class="form-label">Year</label>
          <select name="year" class="form-select" required>
            <option value="">Select</option>
            {% for y in ["First Year","Second Year","Third Year","Final Year"] %}
            <option value="{{ y }}" {% if form.get('year') == y %}selected{% endif %}>{{ y }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Division</label>
          <input type="text" name="division" class="form-control" value="{{ form.get('division','') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Roll Number</label>
          <input type="text" name="roll_number" class="form-control" value="{{ form.get('roll_number','') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Graduation Year</label>
          <input type="text" name="graduation_year" class="form-control" value="{{ form.get('graduation_year','') }}" placeholder="e.g. 2027">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 mt-4">Create Account</button>
    </form>
    <p class="text-center mt-3 mb-0 text-muted-small">
      Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
