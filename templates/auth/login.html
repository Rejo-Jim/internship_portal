{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block guest_content %}
<div class="auth-wrapper">
  <div class="auth-card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="login-brand"><i class="bi bi-mortarboard-fill"></i> Internship Portal</div>
      <div class="text-muted-small">College Training &amp; Placement Cell</div>
    </div>
    <form method="POST" class="needs-validation" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" name="email" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" name="password" id="loginPassword" class="form-control" required minlength="6">
          <button class="btn btn-outline-secondary toggle-password" type="button" data-target="loginPassword"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
    </form>
    <p class="text-center mt-3 mb-0 text-muted-small">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register as a student</a>
    </p>
    <p class="text-center mt-1 text-muted-small">Admins use the same login form with their admin credentials.</p>
  </div>
</div>
{% endblock %}
